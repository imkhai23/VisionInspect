version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: visioninspect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visioninspect_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      REDIS_URL: redis://redis:6379/0
      ENABLE_VIDEO_PROCESSOR: "false"
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./ai/weights:/app/ai/weights
      - ./storage:/app/storage

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: visioninspect_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  training-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visioninspect_training_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.training_worker"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: redis://redis:6379/0
      ENABLE_VIDEO_PROCESSOR: "false"
    depends_on:
      - redis
      - backend
    volumes:
      - ./ai/weights:/app/ai/weights
      - ./storage:/app/storage
